name: Build and publish LibreChat image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit of danny-avila/LibreChat to build"
        required: false
        default: canary

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LibreChat
        uses: actions/checkout@v4
        with:
          repository: danny-avila/LibreChat
          ref: ${{ inputs.ref }}
          path: LibreChat

      - name: Resolve LibreChat commit
        id: commit
        run: echo "sha=$(git -C LibreChat rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./LibreChat
          target: node
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_BRANCH=${{ inputs.ref }}
            BUILD_COMMIT=${{ steps.commit.outputs.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/librechat-mcp-apps:${{ inputs.ref }}
            ghcr.io/${{ github.repository_owner }}/librechat-mcp-apps:${{ steps.commit.outputs.sha }}
